# Roda a suíte de testes em cada push/PR para main. Não existia nenhum
# workflow que rodasse testes antes deste — o único outro workflow do repo
# (scheduled-reports-trigger.yml) é um cron de produção, sem relação com CI.
#
# Os testes E2E (Playwright) usam variáveis VITE_SUPABASE_URL/ANON_KEY
# fictícias: toda chamada de rede que o app faria a um Supabase real é
# interceptada por page.route() dentro dos próprios specs (ver
# frontend/e2e/fixtures/supabase-mock.ts) — nenhum segredo de verdade é
# necessário nem usado aqui.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
